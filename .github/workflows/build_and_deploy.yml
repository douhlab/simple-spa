name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

  pull_request:
     types: [ opened, synchronize, reopened ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------
      # Java Setup
      # ------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ------------------------
      # Build + Run Tests
      # ------------------------
      - name: Build and run tests
        run: mvn clean verify

      - name: SonarCloud Scan
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=douhlab_simple-spa -Dsonar.organization=douhlab -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.qualitygate.wait=false

      # ------------------------
      # Azure Login
      # ------------------------
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ------------------------
      # Login to ACR
      # ------------------------
      - name: Log in to ACR
        env:
            ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          az acr login --name $ACR_NAME

      # ------------------------
      # Build Docker image
      # ------------------------
      - name: Build Docker image
        env:
            ACR_NAME: ${{ secrets.ACR_NAME }}
            GITHUB_SHA: ${{ github.sha }}
        run: |
          docker build -t $ACR_NAME.azurecr.io/simple-spa:$GITHUB_SHA .

      # ------------------------
      # Push Docker image
      # ------------------------
      - name: Push Docker image to ACR
        env:
            ACR_NAME: ${{ secrets.ACR_NAME }}
            GITHUB_SHA: ${{ github.sha }}
        run: |
          docker push $ACR_NAME.azurecr.io/simple-spa:$GITHUB_SHA

      # ------------------------
      # Deploy to Container App
      # ------------------------
      - name: Deploy to Azure Container App
        env:
            ACR_NAME: ${{ secrets.ACR_NAME }}
            GITHUB_SHA: ${{ github.sha }}
        run: |
          az containerapp update \
            --name simple-spa-app \
            --resource-group lab-rg \
            --image $ACR_NAME.azurecr.io/simple-spa:$GITHUB_SHA
