name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------
      # Java Setup
      # ------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ------------------------
      # Build + Run Tests
      # ------------------------
      - name: Build and run tests
        run: mvn clean verify

      - name: SonarCloud Scan
        run: mvn sonar:sonar -Dsonar.projectKey=douhlab_simple-spa -Dsonar.organization=douhlab -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.qualitygate.wait=true

      # ------------------------
      # Azure Login
      # ------------------------
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ------------------------
      # Login to ACR
      # ------------------------
      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # ------------------------
      # Build Docker image
      # ------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/simple-spa:${{ github.sha }} .

      # ------------------------
      # Push Docker image
      # ------------------------
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/simple-spa:${{ github.sha }}

      # ------------------------
      # Deploy to Container App
      # ------------------------
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name simple-spa-app \
            --resource-group lab-rg \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/simple-spa:${{ github.sha }}
