application.product=simple-spa

spring.application.name=simple-spa

### actuator start
# Expose all actuator endpoints
management.endpoints.web.exposure.include=*

# Optional: change base path
management.endpoints.web.base-path=/actuator

# Optional: enable health details
management.endpoint.health.show-details=always

info.app.name=Simple SPA Backend
info.app.version=1.0.0
### actuator end


# Default configuration (will be used for both local and Docker if no profile is set)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!

spa.quartz.job.cron-schedule.my-quartz-job=0 0 0 * * ? *

